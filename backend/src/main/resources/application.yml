server:
  port: 8080

spring:
  application:
    name: sharepad-backend
  datasource:
    url: jdbc:h2:mem:sharepaddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

sharepad:
  default-ttl-hours: 6
  r2:
    endpoint: ${R2_ENDPOINT:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET_NAME:sharepad-storage}
    region: auto
  mock-storage-dir: ${MOCK_STORAGE_DIR:./backend-uploads}

logging:
  level:
    com.sharepad: INFO
    org.springframework.web: INFO
