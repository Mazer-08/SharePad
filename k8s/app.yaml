# ==============================================================================
# SharePad - Complete All-in-One Deployment Manifest
# ==============================================================================
# Apply with:
#   kubectl apply -f k8s/app.yaml
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: sharepad
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@sharepad.duckdns.org
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
---
apiVersion: v1
kind: Service
metadata:
  name: sharepad-backend
  namespace: sharepad
  labels:
    app: sharepad-backend
spec:
  type: ClusterIP
  selector:
    app: sharepad-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharepad-backend
  namespace: sharepad
  labels:
    app: sharepad-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sharepad-backend
  template:
    metadata:
      labels:
        app: sharepad-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: sharepad-backend
          image: ghcr.io/mazer-08/sharepad-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: sharepad-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sharepad-ingress
  namespace: sharepad
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sharepad.duckdns.org
      secretName: sharepad-tls-cert
  rules:
    - host: sharepad.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sharepad-backend
                port:
                  number: 8080
