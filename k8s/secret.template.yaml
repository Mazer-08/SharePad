# ==============================================================================
# SharePad Kubernetes Secret Template
# ==============================================================================
# INSTRUCTIONS:
# 1. Copy this file to `secret.yaml`:
#      cp k8s/secret.template.yaml k8s/secret.yaml
# 2. Fill in your real credentials in `stringData` below.
# 3. Apply it to your K3s cluster:
#      kubectl apply -f k8s/secret.yaml
# 4. NOTICE: `k8s/secret.yaml` is added to .gitignore so it will never be committed.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: sharepad-secrets
  namespace: sharepad
type: Opaque
stringData:
  # PostgreSQL Connection Details
  # Example Neon: jdbc:postgresql://ep-example-12345.us-east-2.aws.neon.tech/sharepad?sslmode=require
  DB_URL: "jdbc:postgresql://<YOUR_DB_HOST>/<YOUR_DB_NAME>?sslmode=require"
  DB_USERNAME: "<YOUR_DB_USERNAME>"
  DB_PASSWORD: "<YOUR_DB_PASSWORD>"

  # Cloudflare R2 / S3 Storage Credentials
  # Example Endpoint: https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com
  R2_ENDPOINT: "https://<YOUR_ACCOUNT_ID>.r2.cloudflarestorage.com"
  R2_ACCESS_KEY_ID: "<YOUR_R2_ACCESS_KEY_ID>"
  R2_SECRET_ACCESS_KEY: "<YOUR_R2_SECRET_ACCESS_KEY>"
  R2_BUCKET_NAME: "sharepad-storage"
